/* Direção visual: azul profundo, violeta e luz ciano. */
@property --progress { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@keyframes ui-rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
@keyframes ui-pop { from { opacity:0; transform:translateY(16px) scale(.96); } to { opacity:1; transform:translateY(0) scale(1); } }
@keyframes ui-fade { from { opacity:0; } to { opacity:1; } }
@keyframes ui-orbit { 0%,100% { transform:translate3d(-2%,0,0) rotate(-3deg); } 50% { transform:translate3d(3%,4%,0) rotate(3deg); } }
@keyframes ui-sheen { from { transform:translateX(-160%) rotate(22deg); } to { transform:translateX(420%) rotate(22deg); } }
@keyframes ui-wave { from { transform:translate(-50%,-50%) scale(0); opacity:.24; } to { transform:translate(-50%,-50%) scale(1); opacity:0; } }
@keyframes ui-row { from { opacity:0; transform:translateX(-9px); } to { opacity:1; transform:translateX(0); } }
@keyframes ui-scan { from { transform:translateY(-80px); } to { transform:translateY(80px); } }
@media screen {
    :root {
        --accent:#7658ef; --accent-soft:#f1edff; --cyan:#08a9be;
        --surface:#fff; --surface-soft:#f5f7fe; --bg:#eef2fc;
        --border:#dfe5f4; --primary:#4d58dd; --primary-strong:#5360e4;
        --primary-soft:#edf0ff; --radius:20px;
        --shadow:0 14px 42px #243b6b0b,0 2px 6px #243b6b04;
        --shadow-soft:0 8px 26px #243b6b0a;
    }
    html[data-theme=dark] {
        --bg:#090f1e; --surface:#111c31; --surface-solid:#111c31;
        --surface-soft:#16233b; --field:#0d172b;
        --text:#f0f3ff; --text-soft:#c3cee7; --muted:#93a4c5;
        --border:#24314d; --border-strong:#344665;
        --primary:#a6b4ff; --primary-strong:#5a66e9; --primary-soft:#222e56;
        --accent:#aa96ff; --accent-soft:#2c244c; --cyan:#5de2ee;
        --success:#75deb0; --success-soft:#143b32;
        --danger:#ff9eb4; --danger-soft:#402437;
        --shadow:0 18px 54px #02071135,0 1px 0 #ffffff04 inset;
        --shadow-soft:0 10px 32px #02071130;
    }
    body { isolation:isolate; background:var(--bg); }
    body::before {
        content:''; position:fixed; inset:-10%; z-index:-2; pointer-events:none;
        background:radial-gradient(ellipse at 8% 5%,#6d5ce71a,transparent 43%),radial-gradient(ellipse at 95% 44%,#00b7c711,transparent 43%);
        animation:ui-orbit 22s ease-in-out infinite;
    }
    html[data-theme=dark] body::before {
        background:radial-gradient(ellipse at 8% 5%,#5540d32e,transparent 43%),radial-gradient(ellipse at 95% 44%,#007e9c21,transparent 43%);
    }
    body::after {
        content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.18;
        background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
        background-size:52px 52px; mask-image:linear-gradient(#000,transparent 72%);
    }
    .app-shell { padding-top:18px; }
    .topbar {
        min-height:74px; top:12px; padding:12px 18px; margin-bottom:30px;
        background:color-mix(in srgb,var(--surface) 82%,transparent);
        border:1px solid var(--border); border-radius:18px;
        backdrop-filter:blur(20px); box-shadow:var(--shadow-soft);
        animation:ui-rise .55s ease-out both;
    }
    .brand-mark {
        width:43px; height:45px; border-radius:13px;
        background:linear-gradient(145deg,#5b65e9,#7657d7);
        box-shadow:0 7px 18px #6159d83d,inset 0 1px 0 #ffffff50;
        transition:transform .3s,box-shadow .3s;
    }
    .brand:hover .brand-mark { transform:rotate(-6deg); box-shadow:0 9px 24px #6159d85c; }
    .brand-copy strong { font-size:19px; font-weight:800; }
    .brand-copy strong small { color:var(--primary); font-weight:600; }
    .nav-link { position:relative; min-height:43px; font-size:12px; transition:background .2s,color .2s,transform .2s; }
    .nav-link.active { background:var(--primary-soft); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 16%,transparent); }
    .nav-link.active::after { content:''; position:absolute; bottom:5px; width:12px; height:2px; border-radius:2px; background:var(--primary); }
    .icon-button { transition:transform .25s,background .25s; }
    .icon-button:hover { transform:rotate(-12deg); }
    .breadcrumb { margin-bottom:14px; }
    .page-heading,.hero {
        position:relative; isolation:isolate; overflow:hidden; color:#fff;
        border:1px solid #8797ff33; border-radius:24px;
        background:radial-gradient(ellipse at 82% -15%,#7863e969,transparent 56%),linear-gradient(115deg,#152746 0%,#233469 55%,#3c3275 100%);
        box-shadow:0 16px 50px #17295725,inset 0 1px 0 #ffffff13;
        animation:ui-rise .7s cubic-bezier(.2,.7,.2,1) both;
    }
    .page-heading { min-height:176px; padding:30px 32px; margin-bottom:22px; gap:22px; }
    .page-heading::before,.hero::before {
        content:''; position:absolute; inset:0; z-index:-1; pointer-events:none;
        background:linear-gradient(110deg,transparent 60%,#ffffff04 60%,#ffffff04 76%,transparent 76%);
    }
    .page-heading::after,.hero::after {
        content:''; width:340px; height:340px; position:absolute; right:-40px; top:-115px;
        z-index:-1; border:1px solid #b4beff1c; border-radius:50%; pointer-events:none;
        box-shadow:0 0 0 42px #a3acff08,0 0 0 85px #a3acff06;
        animation:ui-orbit 16s ease-in-out infinite;
    }
    .hero-kicker { display:inline-flex; align-items:center; gap:8px; color:#a6c8ff; font-size:10px; font-weight:700; letter-spacing:1.7px; text-transform:uppercase; margin-bottom:10px; }
    .hero-kicker::before { content:''; width:5px; height:5px; background:#79ddef; border-radius:50%; box-shadow:0 0 12px #7fdcf48a; }
    .page-heading h1 { font-size:38px; letter-spacing:-1.3px; font-weight:800; }
    .page-heading p { color:#c0cdec; font-size:13px; margin-top:9px; }
    .page-actions { flex-wrap:wrap; justify-content:flex-end; max-width:470px; }
    .page-heading .heading-tag { color:#d5def9; background:#ffffff0b; border-color:#ffffff1e; border-radius:9px; }
    .page-heading .button.secondary { color:#f1f3ff; border-color:#ffffff2b; background:#ffffff10; }
    .page-heading .button.primary { color:#263866; background:#fff; box-shadow:0 5px 20px #0b163230; }
    .page-heading .button.primary:hover { background:#f0f2ff; }
    .stats { gap:16px; margin-bottom:24px; }
    .stat-card {
        --stat-accent:#7184f7; position:relative; isolation:isolate; overflow:hidden;
        min-height:158px; padding:22px 24px; border-radius:18px;
        background:linear-gradient(135deg,color-mix(in srgb,var(--stat-accent) 6%,var(--surface)),var(--surface));
        box-shadow:var(--shadow-soft); transition:transform .28s,box-shadow .28s,border-color .28s;
    }
    .stat-card::before { content:''; position:absolute; left:0; top:24px; bottom:24px; width:3px; border-radius:0 4px 4px 0; background:var(--stat-accent); }
    .stat-card::after { content:''; position:absolute; right:-38px; bottom:-75px; width:145px; height:145px; border-radius:50%; border:22px solid color-mix(in srgb,var(--stat-accent) 6%,transparent); z-index:-1; pointer-events:none; }
    .stat-total { background:linear-gradient(120deg,#4c5ddc,#7452cf); border-color:#a99dff44; color:#fff; box-shadow:0 12px 32px #6357cf36; }
    .stat-total::before { background:#a8ceff; }
    .stat-total::after { border-color:#ffffff0a; }
    .stat-total .stat-label,.stat-total .stat-note { color:#e0e4ff; }
    .stat-total .stat-value { color:#fff; }
    .stat-total .stat-icon { color:#fff; background:#ffffff1c; border-color:#ffffff24; }
    .stat-ok { --stat-accent:#36bc95; }
    .stat-danger { --stat-accent:#e880a7; }
    .stat-work { --stat-accent:#ab83eb; }
    .stat-label { font-size:12px; font-weight:600; }
    .stat-icon { width:39px; height:39px; border-radius:12px; border:1px solid color-mix(in srgb,var(--stat-accent) 18%,transparent); transition:transform .3s; }
    .stat-icon svg { width:20px; height:20px; }
    .stat-work .stat-icon { color:var(--accent); background:var(--accent-soft); }
    .stat-value { font-size:38px; font-weight:800; letter-spacing:-1.2px; margin-top:9px; }
    .stat-note { margin-top:7px; font-size:10px; }
    .motion-entry { animation:ui-rise .65s cubic-bezier(.2,.7,.2,1) both; animation-delay:var(--entry-delay,0ms); }
    .layout { grid-template-columns:minmax(0,1fr) 346px; gap:22px; }
    .card { border-radius:20px; }
    .content-header,.section-head { background:linear-gradient(110deg,color-mix(in srgb,var(--accent) 3%,var(--surface)),var(--surface)); }
    .content-header { padding:24px; }
    .section-title { font-size:20px; font-weight:700; }
    .eyebrow,.section-kicker { color:var(--primary); letter-spacing:1.5px; }
    .section-subtitle { font-size:12px; }
    .aside-header { position:relative; padding:25px 22px 21px; background:linear-gradient(140deg,var(--primary-soft),transparent); }
    .aside-header::after { content:'+'; position:absolute; top:18px; right:20px; display:grid; place-items:center; width:31px; height:31px; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--primary); font-size:20px; }
    .aside-header .eyebrow { padding-right:30px; }
    .aside-header .section-title { font-size:21px; }
    .tabs { margin-top:3px; padding:5px; border-radius:12px; }
    .tab-button { position:relative; overflow:hidden; border-radius:8px; min-height:38px; transition:color .2s,background .2s,box-shadow .2s; }
    .tab-button.active { color:#fff; background:linear-gradient(110deg,#5968e5,#765bda); box-shadow:0 3px 12px #635ddb38; }
    .tab-panel.active { animation:ui-rise .3s ease-out both; }
    .form-section-label { color:var(--primary); font-size:10px; letter-spacing:1px; }
    .field label { font-size:12px; }
    input,select { border-radius:10px; min-height:44px; font-size:13px; transition:border-color .2s,box-shadow .2s,background .2s; }
    input:hover,select:hover { border-color:var(--primary); }
    input:focus,select:focus { box-shadow:0 0 0 4px var(--primary-soft),0 4px 15px #5d67dd12; }
    .button { position:relative; isolation:isolate; overflow:hidden; border-radius:10px; min-height:43px; transition:transform .22s,box-shadow .22s,background .22s,border-color .22s; }
    .button.primary { background:linear-gradient(115deg,#5368e6,#7857db); box-shadow:0 5px 15px #6456d629; }
    .button.primary::after { content:''; position:absolute; left:0; top:-30%; width:35%; height:160%; z-index:-1; background:linear-gradient(90deg,transparent,#ffffff1a,transparent); pointer-events:none; animation:ui-sheen 1.1s ease .45s 1 both; }
    .button:hover:not(:disabled) { filter:none; transform:translateY(-2px); box-shadow:0 6px 16px #1526491f; }
    .button:active:not(:disabled) { transform:translateY(0) scale(.98); }
    .button svg { transition:transform .22s; }
    .button:hover svg { transform:translateY(-1px); }
    .tap-wave { position:absolute; pointer-events:none; z-index:2; border-radius:50%; background:currentColor; animation:ui-wave .6s ease-out both; }
